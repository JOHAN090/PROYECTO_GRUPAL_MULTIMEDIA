<polygon points="591,912 609,912 600,928" fill="#aab5cf"/>
<rect x="190" y="924" width="820" height="70" rx="20" fill="#121936" stroke="#4f8cff" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="967.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Estudiante llena materia, grupo y motivo de solicitud</text>
<line x1="600" y1="1000" x2="600" y2="1018" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1016 609,1016 600,1032" fill="#aab5cf"/>
<rect x="190" y="1028" width="820" height="70" rx="20" fill="#121936" stroke="#f7c948" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1071.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Sistema valida campos obligatorios y formato de correo</text>
<line x1="600" y1="1104" x2="600" y2="1122" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1120 609,1120 600,1136" fill="#aab5cf"/>
<rect x="190" y="1132" width="820" height="70" rx="20" fill="#121936" stroke="#ff6b6b" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1175.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Si hay errores → muestra observaciones y vuelve al formulario</text>
<line x1="600" y1="1208" x2="600" y2="1226" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1224 609,1224 600,1240" fill="#aab5cf"/>
<rect x="190" y="1236" width="820" height="70" rx="20" fill="#121936" stroke="#37d6b3" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1266.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Si todo está correcto → guarda solicitud en</text>
<text x="600" y="1291.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">inscripcion_materias.json</text>
<line x1="600" y1="1312" x2="600" y2="1330" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1328 609,1328 600,1344" fill="#aab5cf"/>
<rect x="190" y="1340" width="820" height="70" rx="20" fill="#121936" stroke="#4f8cff" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1370.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Kardex revisa la solicitud y actualiza estado: Pendiente, En</text>
<text x="600" y="1395.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">revisión, Aprobado o Rechazado</text>
<line x1="600" y1="1416" x2="600" y2="1434" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1432 609,1432 600,1448" fill="#aab5cf"/>
<rect x="190" y="1444" width="820" height="70" rx="20" fill="#121936" stroke="#4f8cff" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1487.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Estudiante consulta el resultado en Mis solicitudes</text>
<line x1="600" y1="1520" x2="600" y2="1538" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1536 609,1536 600,1552" fill="#aab5cf"/>
<rect x="190" y="1548" width="820" height="70" rx="20" fill="#121936" stroke="#37d6b3" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1591.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Fin</text>
</svg>