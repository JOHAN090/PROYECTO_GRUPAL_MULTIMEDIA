<text x="600" y="642.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Estudiante completa datos de matrícula: carrera, semestre y</text>
<text x="600" y="667.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">gestión</text>
<line x1="600" y1="688" x2="600" y2="706" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
