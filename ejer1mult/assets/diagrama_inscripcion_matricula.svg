<line x1="600" y1="376" x2="600" y2="394" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,392 609,392 600,408" fill="#aab5cf"/>
<rect x="190" y="404" width="820" height="70" rx="20" fill="#121936" stroke="#f7c948" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="447.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Sistema verifica si el estudiante está matriculado</text>
<line x1="600" y1="480" x2="600" y2="498" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
