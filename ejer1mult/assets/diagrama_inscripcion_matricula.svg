<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680">
<defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="#0b1020"/>
        <stop offset="100%" stop-color="#172143"/>
    </linearGradient>
    <filter id="shadow">
        <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
</defs>
<rect width="1200" height="1680" fill="url(#bg)"/>
<text x="600" y="54" fill="#ffffff" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">Diagrama de Flujo: Inscripción con Matrícula</text>
<rect x="190" y="92" width="820" height="70" rx="20" fill="#121936" stroke="#37d6b3" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="135.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Inicio</text>
<line x1="600" y1="168" x2="600" y2="186" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,184 609,184 600,200" fill="#aab5cf"/>
<rect x="190" y="196" width="820" height="70" rx="20" fill="#121936" stroke="#4f8cff" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="239.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Estudiante inicia sesión en la plataforma</text>
