<text x="600" y="863.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Sistema registra el movimiento del estudiante en flujos.json</text>
<line x1="600" y1="896" x2="600" y2="914" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,912 609,912 600,928" fill="#aab5cf"/>
