<text x="600" y="434.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Llena el formulario con tipo de certificado, carrera, correo y</text>
<text x="600" y="459.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">motivo</text>
<line x1="600" y1="480" x2="600" y2="498" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
