<text x="600" y="551.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Sistema valida campos obligatorios y correo institucional</text>
<line x1="600" y1="584" x2="600" y2="602" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
