<text x="600" y="967.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Kardex revisa la solicitud y verifica la información académica</text>
<line x1="600" y1="1000" x2="600" y2="1018" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1016 609,1016 600,1032" fill="#aab5cf"/>
<rect x="190" y="1028" width="820" height="70" rx="20" fill="#121936" stroke="#4f8cff" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1058.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Kardex actualiza estado: Pendiente, En revisión, Aprobado o</text>
<text x="600" y="1083.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Rechazado</text>
<line x1="600" y1="1104" x2="600" y2="1122" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
