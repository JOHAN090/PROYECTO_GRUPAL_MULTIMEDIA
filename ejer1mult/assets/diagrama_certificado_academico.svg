<text x="600" y="746.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Si los datos son correctos → guarda solicitud en</text>
<text x="600" y="771.5" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">certificado_academico.json</text>
<line x1="600" y1="792" x2="600" y2="810" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
