<text x="600" y="1175.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Estudiante consulta el resultado en Mis solicitudes</text>
<line x1="600" y1="1208" x2="600" y2="1226" stroke="#aab5cf" stroke-width="4" stroke-linecap="round"/>
<polygon points="591,1224 609,1224 600,1240" fill="#aab5cf"/>
<rect x="190" y="1236" width="820" height="70" rx="20" fill="#121936" stroke="#37d6b3" stroke-width="3" filter="url(#shadow)"/>
<text x="600" y="1279.0" fill="#f4f7fb" font-family="Arial" font-size="22" font-weight="600" text-anchor="middle">Fin</text>
